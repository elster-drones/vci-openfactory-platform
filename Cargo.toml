[package]
name = "vci-openfactory-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "VCI forwarding component for the OpenFactory host configuration CLI"
repository = "https://github.com/elster-drones/vci-openfactory-platform"

[dependencies]
vci = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
